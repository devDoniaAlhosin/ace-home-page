<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACE — Homepage demos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #181818;
    --red: #EF3340;
    --white: #fff;
    --muted: #a0a0a0;
    --ease: cubic-bezier(.22, .8, .2, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0a0a;
    font-family: Poppins, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  .frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }

  .rail {
    position: fixed;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border-radius: 14px;
    background: rgba(24, 24, 24, .92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .35);
  }

  .rail__label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    padding: 2px 4px 6px;
  }

  .rail button {
    appearance: none;
    border: 0;
    cursor: pointer;
    min-width: 72px;
    padding: 12px 14px;
    border-radius: 10px;
    background: transparent;
    color: rgba(255, 255, 255, .72);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.2;
    text-align: left;
    transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
  }

  .rail button span {
    display: block;
    font-size: 10px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: .04em;
  }

  .rail button:hover {
    background: rgba(255, 255, 255, .08);
    color: var(--white);
  }

  .rail button.is-active {
    background: var(--red);
    color: var(--white);
  }

  .rail button.is-active span {
    color: rgba(255, 255, 255, .8);
  }

  .rail button:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: 2px;
  }

  @media (max-width: 640px) {
    .rail {
      top: auto;
      bottom: 16px;
      right: 50%;
      transform: translateX(50%);
      flex-direction: row;
      align-items: stretch;
      padding: 8px;
      gap: 6px;
    }

    .rail__label {
      display: none;
    }

    .rail button {
      min-width: 64px;
      padding: 10px 12px;
      text-align: center;
    }

    .rail button span {
      display: none;
    }
  }
</style>
</head>
<body>
  <iframe
    id="demo-frame"
    class="frame"
    title="ACE homepage demo"
    src="index.html"
  ></iframe>

  <nav class="rail" aria-label="Demo versions">
    <div class="rail__label">Demos</div>
    <button type="button" data-src="index.html" data-id="v1" class="is-active" aria-pressed="true">
      V1
      <span>index</span>
    </button>
    <button type="button" data-src="ace-homepage-v2.html" data-id="v2" aria-pressed="false">
      V2
      <span>notched bento</span>
    </button>
    <button type="button" data-src="ace-home-v3.html" data-id="v3" aria-pressed="false">
      V3
      <span>Corporate 2</span>
    </button>
  </nav>

  <script>
    (function () {
      var frame = document.getElementById('demo-frame');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.rail button[data-src]'));
      var map = {
        v1: 'index.html',
        v2: 'ace-homepage-v2.html',
        v3: 'ace-home-v3.html'
      };

      function activate(id) {
        var src = map[id] || map.v1;
        if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);

        buttons.forEach(function (btn) {
          var on = btn.getAttribute('data-id') === id;
          btn.classList.toggle('is-active', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });

        if (location.hash.slice(1) !== id) {
          history.replaceState(null, '', '#' + id);
        }
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          activate(btn.getAttribute('data-id'));
        });
      });

      var start = (location.hash.slice(1) || 'v1').toLowerCase();
      if (!map[start]) start = 'v1';
      activate(start);

      window.addEventListener('hashchange', function () {
        var id = (location.hash.slice(1) || 'v1').toLowerCase();
        if (!map[id]) id = 'v1';
        activate(id);
      });
    })();
  </script>
</body>
</html>
